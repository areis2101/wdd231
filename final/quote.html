<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a free cleaning estimate from Avek Cleaning - tell us about your home and we'll get back to you with an exact price.">
    <meta name="author" content="Alice Reis">
    <meta property="og:title" content="Get a Quote | Avek Cleaning">
    <meta property="og:description" content="Request your free 15-minute estimate with Avek Cleaning.">
    <meta property="og:image" content="https://areis2101.github.io/wdd231/final/images/hero.webp">
    <meta property="og:url" content="https://areis2101.github.io/wdd231/final/quote.html">
    <meta property="og:type" content="website">
    <title>Get a Quote | Avek Cleaning</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <script type="module" src="scripts/main.js"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">✦ AVEK <span>Cleaning</span></a>
            <button id="menu-btn" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
            <nav id="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="quote.html" class="active" aria-current="page">Get a Quote</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-head">
            <h1>Request a Free Estimate</h1>
            <p>Tell us about your home and we'll get back to you the same day with your free 15-minute walkthrough.</p>
        </section>

        <form method="get" action="confirm.html" class="quote-form">
            <label>Full Name*
                <input type="text" name="name" required placeholder="Your full name" autocomplete="name">
            </label>
            <label>Email*
                <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
            </label>
            <label>Phone
                <input type="tel" name="phone" placeholder="(555) 555-5555" autocomplete="tel">
            </label>
            <label>Type of Cleaning*
                <select name="service" required>
                    <option value="" disabled selected>Select a service…</option>
                    <option value="Regular Cleaning">Regular Cleaning</option>
                    <option value="Deep Cleaning">Deep Cleaning</option>
                    <option value="Move-In Cleaning">Move-In Cleaning</option>
                    <option value="Move-Out Cleaning">Move-Out Cleaning</option>
                    <option value="Office Cleaning">Office Cleaning</option>
                    <option value="Airbnb Turnover">Airbnb Turnover</option>
                </select>
            </label>
            <div class="form-row">
                <label>Bedrooms*
                    <input type="number" name="bedrooms" min="0" max="20" required>
                </label>
                <label>Bathrooms*
                    <input type="number" name="bathrooms" min="0" max="20" step="0.5" required>
                </label>
            </div>
            <label>Approx. size (sq ft)
                <input type="number" name="sqft" min="100" max="20000" placeholder="e.g. 3000">
            </label>
            <fieldset>
                <legend>How often?</legend>
                <label class="radio"><input type="radio" name="frequency" value="One-time" checked> One-time</label>
                <label class="radio"><input type="radio" name="frequency" value="Weekly"> Weekly</label>
                <label class="radio"><input type="radio" name="frequency" value="Bi-weekly"> Bi-weekly</label>
                <label class="radio"><input type="radio" name="frequency" value="Monthly"> Monthly</label>
            </fieldset>
            <label>Anything we should know?
                <textarea name="notes" rows="3" placeholder="Pets, preferred days, special requests…"></textarea>
            </label>
            <button type="submit" class="btn">Send Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Avek Cleaning | Alice Reis | WDD 231 Final Project</p>
        <p>
            <a href="attributions.html">Attributions</a> ·
            <a href="https://www.youtube.com/" id="video-link">Video Demonstration</a>
        </p>
        <p>Last modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
